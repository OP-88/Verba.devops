[package]
name = "verba-desktop"
version = "2.0.0"
description = "AI-Powered Audio Transcription with Speaker Diarization"
authors = ["Verba Team"]
license = "MIT"
repository = "https://github.com/OP-88/Verba.devops"
default-run = "verba-desktop"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.0", features = ["api-all", "system-tray"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-args=/SUBSYSTEM:WINDOWS"]